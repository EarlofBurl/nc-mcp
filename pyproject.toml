[project]
name = "nc-mcp"
version = "0.1.0"
description = "MCP server for Nextcloud: Files, Notes, Calendar, Tasks, Contacts and Talk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12",
    "httpx>=0.28",
    "icalendar>=6.1",
]

[project.scripts]
nc-mcp = "nc_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nc_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
