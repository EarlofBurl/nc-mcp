services:
  nc-mcp:
    build: .
    container_name: nc-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8010"
    ports:
      # Bound to the LAN IP so a reverse proxy (Nginx Proxy Manager, Apache
      # vhost, ...) on another host can forward to it. Content is protected by
      # the MCP_TOKEN; do NOT port-forward this on your router.
      - "192.168.1.195:8010:8010"
